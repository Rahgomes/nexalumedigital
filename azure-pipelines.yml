name: NexaLume - $(Date:yyyyMMdd)$(Rev:r)

trigger:
  branches:
    include:
      - main
      - develop

pr: none

pool:
  name: rah-self-hosted

resources:
  repositories:
    - repository: templates
      type: github
      name: Rahgomes/rah-pipeline-templates
      ref: main
      endpoint: Rahgomes

variables:
  - group: Telegram-Rah-Automation-Notifier-Credentials
  - group: NexaLume-Credentials
  - name: APP_NAME
    value: "NexaLume"
  - name: IS_MAIN
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/main')]
  - name: IS_DEVELOP
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/develop')]

stages:
  # ==================== BUILD ====================
  - stage: Build
    displayName: "Build Docker Image"
    jobs:
      - job: BuildJob
        displayName: "Build"
        steps:
          - checkout: self
            displayName: "Checkout source code"

          - template: templates/notify-start.yml@templates
            parameters:
              appName: NexaLume

          - script: |
              set -euo pipefail
              BRANCH=$(Build.SourceBranchName)
              if [ "$BRANCH" = "main" ]; then
                IMAGE_NAME="nexalume-prod"
              else
                IMAGE_NAME="nexalume-dev"
              fi
              echo "##vso[task.setvariable variable=IMAGE_NAME]$IMAGE_NAME"
              echo "Building Docker image: $IMAGE_NAME..."
              docker build -t $IMAGE_NAME:$(Build.BuildId) -t $IMAGE_NAME:latest .
              echo "Build completed successfully"
              docker images $IMAGE_NAME --format "table {{.Tag}}\t{{.Size}}\t{{.CreatedAt}}" | head -5
            displayName: "Build Docker image"

  # ==================== DEPLOY DEV ====================
  - stage: DeployDev
    displayName: "Deploy DEV"
    dependsOn: Build
    condition: and(succeeded(), eq(variables.IS_DEVELOP, true))
    jobs:
      - job: DeployDevJob
        displayName: "Deploy dev.nexalumedigital.com.br"
        steps:
          - script: |
              set -euo pipefail
              # Remove old Coolify-managed containers (migration)
              for c in $(docker ps -a --filter "name=y0gkwc84cg848o4g8gsswcsc" --format "{{.Names}}"); do
                docker stop "$c" 2>/dev/null || true
                docker rm "$c" 2>/dev/null || true
              done
            displayName: "Cleanup old containers"

          - template: templates/deploy-container.yml@templates
            parameters:
              containerName: nexalume-dev
              imageName: nexalume-dev
              domain: dev.nexalumedigital.com.br
              port: "3000"
              coolifyAppId: "1"
              coolifyUuid: y0gkwc84cg848o4g8gsswcsc
              coolifyResourceName: nexalume-dev
              coolifyProjectName: nexa-lume-digital
              coolifyEnvironment: development
              envFlags: '-e NODE_ENV=production -e "NEXT_PUBLIC_WHATSAPP_NUMBER=$(NEXT_PUBLIC_WHATSAPP_NUMBER)" -e "NEXT_PUBLIC_WHATSAPP_MESSAGE=$(NEXT_PUBLIC_WHATSAPP_MESSAGE)"'

          - template: templates/notify-result.yml@templates
            parameters:
              appName: NexaLume
              containerName: nexalume-dev
              domain: dev.nexalumedigital.com.br
              envLabel: DEV

  # ==================== AUTO PR (develop → main) ====================
  - stage: CreatePR
    displayName: "Create PR to PROD"
    dependsOn: DeployDev
    condition: succeeded()
    jobs:
      - job: CreatePRJob
        displayName: "Open PR develop → main"
        steps:
          - checkout: self
            displayName: "Checkout source code"

          - script: |
              set -euo pipefail
              COMMIT_SHORT=$(git rev-parse --short HEAD)
              COMMIT_MSG=$(git log -1 --pretty=%s)

              # Check if PR already exists
              EXISTING_PR=$(curl -s \
                -H "Authorization: token $(GITHUB_PAT)" \
                "https://api.github.com/repos/Rahgomes/nexalumedigital/pulls?state=open&head=Rahgomes:develop&base=main" \
                | python3 -c "import json,sys; prs=json.load(sys.stdin); print(prs[0]['number'] if prs else '')" 2>/dev/null || echo "")

              if [ -n "$EXISTING_PR" ]; then
                echo "PR #$EXISTING_PR already open — skipping creation"
                PR_URL="https://github.com/Rahgomes/nexalumedigital/pull/$EXISTING_PR"
              else
                echo "Creating PR develop → main..."
                PR_URL=$(curl -s -X POST \
                  -H "Authorization: token $(GITHUB_PAT)" \
                  -H "Content-Type: application/json" \
                  "https://api.github.com/repos/Rahgomes/nexalumedigital/pulls" \
                  -d "{
                    \"title\": \"Deploy PROD — $COMMIT_MSG\",
                    \"body\": \"## Deploy para Producao\n\nCommit: \`$COMMIT_SHORT\` — $COMMIT_MSG\n\nDEV validado com sucesso em https://dev.nexalumedigital.com.br\n\n> Aprovar e mergear para acionar deploy em PROD.\",
                    \"head\": \"develop\",
                    \"base\": \"main\"
                  }" | python3 -c "import json,sys; print(json.load(sys.stdin).get('html_url',''))")
                echo "PR created: $PR_URL"
              fi

              curl -s -X POST \
                "https://api.telegram.org/bot$(TELEGRAM_BOT_TOKEN)/sendMessage" \
                -H "Content-Type: application/json" \
                -d "{
                  \"chat_id\": \"$(TELEGRAM_CHAT_ID)\",
                  \"text\": \"📋 <b>PR CRIADO — $(APP_NAME)</b>\nDEV ok. Aprovar para deploy em PROD:\n$PR_URL\",
                  \"parse_mode\": \"HTML\"
                }" > /dev/null
            displayName: "Create or update PR"
            env:
              GITHUB_PAT: $(GITHUB_PAT)
              TELEGRAM_BOT_TOKEN: $(TELEGRAM_BOT_TOKEN)
              TELEGRAM_CHAT_ID: $(TELEGRAM_CHAT_ID)

  # ==================== DEPLOY PROD ====================
  - stage: DeployProd
    displayName: "Deploy PROD"
    dependsOn: Build
    condition: and(succeeded(), eq(variables.IS_MAIN, true))
    jobs:
      - job: DeployProdJob
        displayName: "Deploy nexalumedigital.com.br"
        steps:
          - template: templates/deploy-container.yml@templates
            parameters:
              containerName: nexalume-prod
              imageName: nexalume-prod
              domain: nexalumedigital.com.br
              port: "3000"
              coolifyAppId: "8"
              coolifyUuid: z91kut1jw73xy8oocq95c1e0
              coolifyResourceName: nexalume-prod
              coolifyProjectName: nexa-lume-digital
              coolifyEnvironment: production
              envFlags: '-e NODE_ENV=production -e "NEXT_PUBLIC_WHATSAPP_NUMBER=$(NEXT_PUBLIC_WHATSAPP_NUMBER)" -e "NEXT_PUBLIC_WHATSAPP_MESSAGE=$(NEXT_PUBLIC_WHATSAPP_MESSAGE)"'

          - template: templates/notify-result.yml@templates
            parameters:
              appName: NexaLume
              containerName: nexalume-prod
              domain: nexalumedigital.com.br
              envLabel: PROD

  # ==================== SYNC develop (after PROD deploy) ====================
  - stage: SyncDevelop
    displayName: "Sync develop ← main"
    dependsOn: DeployProd
    condition: succeeded()
    jobs:
      - job: SyncJob
        displayName: "Sync develop with main"
        steps:
          - checkout: self
            persistCredentials: true
            displayName: "Checkout source code"

          - script: |
              set -euo pipefail
              git config user.name "Azure DevOps Pipeline"
              git config user.email "pipeline@rahz1n.dev"

              echo "Fetching all branches..."
              git fetch origin

              echo "Checking out develop..."
              git checkout develop
              git pull origin develop

              echo "Merging main into develop..."
              if git merge origin/main --no-edit; then
                git push origin develop
                echo "develop synced with main successfully"

                curl -s -X POST \
                  "https://api.telegram.org/bot$(TELEGRAM_BOT_TOKEN)/sendMessage" \
                  -H "Content-Type: application/json" \
                  -d "{
                    \"chat_id\": \"$(TELEGRAM_CHAT_ID)\",
                    \"text\": \"🔄 <b>SYNC — $(APP_NAME)</b>\nBranch develop sincronizada com main.\",
                    \"parse_mode\": \"HTML\"
                  }" > /dev/null
              else
                echo "Merge conflict — manual resolution needed"
                git merge --abort

                curl -s -X POST \
                  "https://api.telegram.org/bot$(TELEGRAM_BOT_TOKEN)/sendMessage" \
                  -H "Content-Type: application/json" \
                  -d "{
                    \"chat_id\": \"$(TELEGRAM_CHAT_ID)\",
                    \"text\": \"⚠️ <b>SYNC FALHOU — $(APP_NAME)</b>\nConflito ao mergear main → develop. Resolver manualmente.\",
                    \"parse_mode\": \"HTML\"
                  }" > /dev/null
                exit 1
              fi
            displayName: "Merge main into develop"
            env:
              TELEGRAM_BOT_TOKEN: $(TELEGRAM_BOT_TOKEN)
              TELEGRAM_CHAT_ID: $(TELEGRAM_CHAT_ID)
